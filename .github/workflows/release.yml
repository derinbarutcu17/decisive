name: Release macOS app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Ensure Electron binary
        # Electron 43 moved its download step out of npm lifecycle scripts.
        # Keep release builds reliable on clean macOS runners as well.
        run: |
          if [ ! -e "$PWD/node_modules/electron/dist/electron" ] && [ ! -e "$PWD/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron" ]; then
            node node_modules/electron/install.js
          fi

      - name: Run release preflight
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:preflight

      - name: Run full verification suite
        run: npm run verify

      - name: Package arm64 and Intel builds
        run: npx --no-install electron-builder --mac dmg zip --arm64 --x64 --publish never

      - name: Create release checksums
        run: npm run release:artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
