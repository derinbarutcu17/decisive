name: Release macOS app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release preflight
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:preflight

      - name: Run full verification suite
        run: npm run verify

      - name: Package arm64 and Intel builds
        run: npx --no-install electron-builder --mac dmg zip --arm64 --x64 --publish never

      - name: Create release checksums
        run: npm run release:artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@26e8ad27a09a225049a7075d7ec1caa2df6ff332 # v2.6.0
        with:
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
