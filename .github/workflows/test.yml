name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        # Electron's postinstall downloads the binary used by the isolated
        # browser verification suite. The package manifest explicitly allows
        # only Electron's install script.
        run: npm ci
      - name: Configure Electron sandbox
        # Electron's Linux E2E runner requires the helper to retain the
        # ownership and setuid bit shipped in the Electron archive. Fresh
        # npm installs on GitHub-hosted runners can lose those attributes.
        if: runner.os == 'Linux'
        run: |
          sandbox_path="$PWD/node_modules/electron/dist/chrome-sandbox"
          test -f "$sandbox_path"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
      - name: Run full verification suite
        run: npm run verify
