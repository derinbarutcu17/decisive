<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Decisive local-first decision loop</title>
  <desc id="desc">Capture a task, place it in a consequence quadrant, focus on the next action, and keep the data local.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label { font: 600 14px Inter, -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: .16em; text-transform: uppercase; fill: #8f8f8f; }
      .title { font: 700 42px Inter, -apple-system, BlinkMacSystemFont, sans-serif; fill: #f1f1f1; }
      .body { font: 500 17px Inter, -apple-system, BlinkMacSystemFont, sans-serif; fill: #a6a6a6; }
      .card-title { font: 700 20px Inter, -apple-system, BlinkMacSystemFont, sans-serif; fill: #f1f1f1; }
      .card-body { font: 500 14px Inter, -apple-system, BlinkMacSystemFont, sans-serif; fill: #979797; }
    </style>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#wash)"/>
  <rect width="1200" height="520" rx="28" fill="url(#grid)"/>
  <circle cx="1034" cy="68" r="120" fill="#477fd6" opacity=".08" filter="url(#glow)"/>
  <circle cx="242" cy="456" r="140" fill="#4ad1bd" opacity=".05" filter="url(#glow)"/>

  <text x="58" y="70" class="label">LOCAL-FIRST / DECISION SYSTEM</text>
  <text x="58" y="122" class="title">Capture less. Decide better.</text>
  <text x="58" y="154" class="body">A calm operating loop for the work that actually matters.</text>

  <g transform="translate(58 220)">
    <rect width="236" height="154" rx="18" fill="#151515" stroke="#343434"/>
    <circle cx="28" cy="32" r="7" fill="#6aa4ff"/>
    <text x="50" y="39" class="card-title">Capture</text>
    <text x="24" y="82" class="card-body">One frictionless input.</text>
    <text x="24" y="106" class="card-body">No inbox ceremony.</text>
    <path d="M236 77h42" stroke="#555" stroke-width="2" stroke-linecap="round"/>
    <path d="m270 68 10 9-10 9" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(344 220)">
    <rect width="236" height="154" rx="18" fill="#151515" stroke="#343434"/>
    <circle cx="28" cy="32" r="7" fill="#4ad1bd"/>
    <text x="50" y="39" class="card-title">Classify</text>
    <text x="24" y="82" class="card-body">Do · schedule · delegate</text>
    <text x="24" y="106" class="card-body">or eliminate the noise.</text>
    <path d="M236 77h42" stroke="#555" stroke-width="2" stroke-linecap="round"/>
    <path d="m270 68 10 9-10 9" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(630 220)">
    <rect width="236" height="154" rx="18" fill="#151515" stroke="#343434"/>
    <circle cx="28" cy="32" r="7" fill="#ffc044"/>
    <text x="50" y="39" class="card-title">Focus</text>
    <text x="24" y="82" class="card-body">Keep the next move visible.</text>
    <text x="24" y="106" class="card-body">Drag, edit, complete.</text>
    <path d="M236 77h42" stroke="#555" stroke-width="2" stroke-linecap="round"/>
    <path d="m270 68 10 9-10 9" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(916 220)">
    <rect width="226" height="154" rx="18" fill="#151515" stroke="#343434"/>
    <circle cx="28" cy="32" r="7" fill="#70d698"/>
    <text x="50" y="39" class="card-title">Keep local</text>
    <text x="24" y="82" class="card-body">Offline by default.</text>
    <text x="24" y="106" class="card-body">Your tasks stay yours.</text>
  </g>

  <text x="58" y="456" class="label">DECISIVE / MACOS + WEB PREVIEW</text>
  <text x="1142" y="456" text-anchor="end" class="label">NO SYNC · NO NOISE</text>
</svg>
